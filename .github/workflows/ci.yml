name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build example app
        run: >-
          xcodebuild
          -project Examples/APIInspectorDemo/APIInspectorDemo.xcodeproj
          -scheme APIInspectorDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
